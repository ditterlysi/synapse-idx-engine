[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-idx-engine"
version = "0.16.0"
description = "Synapse IDX disclosure ingestion, document extraction, and structured intelligence engine"
requires-python = ">=3.11"
dependencies = [
  "httpx[http2]>=0.27,<1",
  "tenacity>=9,<10",
  "typer>=0.12,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dateutil>=2.9,<3",
  "tzdata>=2025.2; platform_system == 'Windows'",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<12",
  "pytesseract>=0.3.13,<1",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "beautifulsoup4>=4.12,<5",
  "playwright>=1.50,<2",
  "rich>=13.8,<16",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
idx-digest = "idx_digest.cli:app"
synapse-idx-engine = "idx_digest.synapse_cli:app"
synapse-idx-public-snapshot = "idx_digest.idx_public_snapshot_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E401", "E701", "E702", "I001"]

[tool.setuptools.package-data]
idx_digest = ["web/*.html"]
