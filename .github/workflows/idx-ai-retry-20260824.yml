name: IDX AI Retry 2026-08-24

on:
  push:
    branches:
      - ops/idx-ai-retry-20260824
    paths:
      - ops/idx-ai-retry-trigger.txt

permissions:
  contents: read

concurrency:
  group: idx-ai-retry-20260824
  cancel-in-progress: false

env:
  AI_PROVIDER: gemini
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  SYNAPSE_INTERNAL_BASE_URL: ${{ secrets.SYNAPSE_INTERNAL_BASE_URL }}
  SYNAPSE_INGESTION_SECRET: ${{ secrets.SYNAPSE_INGESTION_SECRET }}
  APP_TIMEZONE: Asia/Jakarta
  SYNAPSE_DAILY_TRANSPORT: http
  SYNAPSE_DAILY_ALLOW_HISTORICAL_BACKFILL: "false"
  SYNAPSE_DAILY_ALLOW_TICKER_FANOUT: "false"

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ind

      - name: Install engine
        run: python -m pip install -e .

      - name: Retry stock-scope PARTIAL disclosures
        run: python ops/idx_ai_retry_20260824.py

      - name: Upload retry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idx-ai-retry-20260824-report
          path: ops/idx-ai-retry-result.json
          if-no-files-found: warn
