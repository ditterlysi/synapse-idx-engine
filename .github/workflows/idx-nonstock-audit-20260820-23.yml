name: IDX Non-Stock Audit 2026-08-20 to 23

on:
  push:
    branches:
      - ops/idx-nonstock-audit-20260820-23
    paths:
      - ops/idx-nonstock-audit-trigger.txt

permissions:
  contents: write

concurrency:
  group: idx-nonstock-audit-20260820-23
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ops/idx-nonstock-audit-20260820-23

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Read IDX metadata only
        run: python ops/idx_nonstock_audit_20260820_23.py

      - name: Commit audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/idx-nonstock-audit-result.json ops/idx-nonstock-raw-ids.txt
          git diff --cached --quiet || git commit -m "Record legacy IDX non-stock audit"
          git push origin HEAD:ops/idx-nonstock-audit-20260820-23
