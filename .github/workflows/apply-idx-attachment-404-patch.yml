name: Apply IDX Attachment 404 Patch

on:
  push:
    branches:
      - fix/idx-attachment-404-resilience
    paths:
      - ops/apply-idx-404-patch-trigger.txt

permissions:
  contents: write

concurrency:
  group: apply-idx-attachment-404-patch
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/idx-attachment-404-resilience

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply patch
        run: python ops/apply_idx_attachment_404_patch.py

      - name: Install engine
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/idx_digest/idx_polite_http.py src/idx_digest/sources/idx_website.py tests/test_idx_polite_http.py tests/test_idx_website_source.py
          git diff --cached --quiet || git commit -m "Skip transiently missing IDX attachments without checkpointing"
          git push origin HEAD:fix/idx-attachment-404-resilience
