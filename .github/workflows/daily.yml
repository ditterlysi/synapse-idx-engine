name: IDX Daily Collector

on:
  schedule:
    # Primary: 20:07 UTC = 03:07 Asia/Jakarta (next calendar day).
    - cron: "7 20 * * *"
    # Delivery backup: 20:37 UTC = 03:37 Asia/Jakarta. A preflight guard
    # suppresses this run when another scheduled delivery was created recently.
    - cron: "37 20 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".ops/idx-collector-kick.txt"

concurrency:
  group: idx-daily-collector-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  schedule_preflight:
    name: Schedule delivery guard
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Suppress duplicate scheduled delivery
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          output_path = os.environ["GITHUB_OUTPUT"]

          def emit(value: bool, message: str) -> None:
              print(message)
              with open(output_path, "a", encoding="utf-8") as handle:
                  handle.write(f"should_run={'true' if value else 'false'}\n")

          if os.environ.get("EVENT_NAME") != "schedule":
              emit(True, "Non-scheduled trigger: collector remains enabled.")
              raise SystemExit(0)

          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          repository = os.environ["REPOSITORY"]
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/"
              "daily.yml/runs?event=schedule&per_page=20"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "synapse-idx-schedule-guard",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  payload = json.load(response)
          except Exception as exc:
              # Delivery reliability is more important than avoiding a rare
              # duplicate. Fail open if GitHub cannot answer the guard query.
              emit(True, f"Schedule guard API unavailable; failing open: {exc}")
              raise SystemExit(0)

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(hours=2)
          recent_other_runs = []
          for run in payload.get("workflow_runs", []):
              if int(run.get("id") or 0) == current_run_id:
                  continue
              created_raw = run.get("created_at")
              if not isinstance(created_raw, str):
                  continue
              try:
                  created_at = datetime.fromisoformat(created_raw.replace("Z", "+00:00"))
              except ValueError:
                  continue
              if cutoff <= created_at <= now:
                  recent_other_runs.append((run.get("id"), created_raw, run.get("status")))

          if recent_other_runs:
              emit(
                  False,
                  "Scheduled collector delivery already exists within two hours; "
                  f"preventing duplicate: {recent_other_runs[0]}",
              )
          else:
              emit(True, "No recent scheduled collector delivery found; collector will run.")
          PY

  collect:
    needs: schedule_preflight
    if: ${{ vars.IDX_DAILY_ENABLED == 'true' && needs.schedule_preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Optional. Gemini-only behavior remains unchanged when both are absent.
      CLOUDFLARE_AI_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_AI_ACCOUNT_ID }}
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
      CLOUDFLARE_AI_MODEL: "@cf/zai-org/glm-4.7-flash"
      SYNAPSE_INTERNAL_BASE_URL: ${{ secrets.SYNAPSE_INTERNAL_BASE_URL }}
      SYNAPSE_INGESTION_SECRET: ${{ secrets.SYNAPSE_INGESTION_SECRET }}
      SYNAPSE_DAILY_ENABLED: "true"
      APP_TIMEZONE: Asia/Jakarta
      SYNAPSE_DAILY_TRANSPORT: http
      SYNAPSE_DAILY_MAX_SOURCE_REQUESTS: "100"
      SYNAPSE_DAILY_MAX_RUN_SECONDS: "4800"
      SYNAPSE_DAILY_ALLOW_HISTORICAL_BACKFILL: "false"
      SYNAPSE_DAILY_ALLOW_TICKER_FANOUT: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ind
          tesseract --version

      - name: Install engine
        run: python -m pip install -e .

      - name: Run daily collector
        run: |
          set -o pipefail
          synapse-idx-website daily --confirm-schedule | tee idx-daily-report.json

      # Read-only Synapse source-state check. It does not contact IDX or AI and
      # cannot advance the checkpoint. continue-on-error keeps observability
      # from masking the collector's actual outcome.
      - name: Capture durable source state
        if: always()
        continue-on-error: true
        run: synapse-idx-website health > idx-daily-health.json

      - name: Write run summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("idx-daily-report.json")
          health_path = Path("idx-daily-health.json")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["## IDX Daily Collector", ""]

          report = None
          if not report_path.exists() or not report_path.read_text(encoding="utf-8").strip():
              lines.append("No collector JSON report was produced.")
          else:
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  lines.append(f"Collector report was not valid JSON: `{exc}`")

          if isinstance(report, dict):
              lines.append("### Run")
              for key in (
                  "ok",
                  "status",
                  "runId",
                  "processingOk",
                  "sourceRequests",
                  "checkpointCommitted",
                  "scheduleEnabled",
              ):
                  if key in report:
                      lines.append(f"- **{key}**: `{report[key]}`")

              source = report.get("sourceDiagnostics")
              if isinstance(source, dict):
                  lines.extend(["", "### Source / progress"])
                  source_fields = (
                      ("requestBudgetDeferred", "requestBudgetDeferred"),
                      ("requestBudgetDeferredRowId", "requestBudgetDeferredRowId"),
                      ("checkpointSeenIds", "checkpointSeenIdsBefore"),
                      ("issuerDisclosuresProcessed", "issuerDisclosuresProcessed"),
                      ("newCandidates", "newCandidates"),
                      ("alreadySeenInRequestedWindow", "alreadySeenInRequestedWindow"),
                      ("metadataRowsInRequestedWindow", "metadataRowsInRequestedWindow"),
                      ("titleFallbackRows", "titleFallbackRows"),
                  )
                  for source_key, label in source_fields:
                      if source_key in source:
                          lines.append(f"- **{label}**: `{source[source_key]}`")

              publish = report.get("publish")
              if isinstance(publish, dict):
                  lines.extend(["", "### Publish / AI"])
                  for key in (
                      "disclosuresAvailable",
                      "disclosuresCreated",
                      "attachmentsStaged",
                      "filesExtracted",
                      "documentsAnalyzed",
                      "analysesCompleted",
                      "partialDisclosures",
                  ):
                      if key in publish:
                          lines.append(f"- **{key}**: `{publish[key]}`")
                  errors = publish.get("errors")
                  if isinstance(errors, list):
                      lines.append(f"- **errorsCount**: `{len(errors)}`")

          health = None
          if health_path.exists() and health_path.read_text(encoding="utf-8").strip():
              try:
                  health = json.loads(health_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  health = None

          if isinstance(health, dict):
              checkpoint = health.get("checkpoint")
              if isinstance(checkpoint, dict):
                  seen_ids = checkpoint.get("seenIds")
                  lines.extend(["", "### Durable checkpoint after run"])
                  if isinstance(seen_ids, list):
                      lines.append(f"- **checkpointSeenIdsAfter**: `{len(seen_ids)}`")
                  if "latestAnnouncedAt" in checkpoint:
                      lines.append(f"- **latestAnnouncedAt**: `{checkpoint['latestAnnouncedAt']}`")
                  if "committedAt" in checkpoint:
                      lines.append(f"- **committedAt**: `{checkpoint['committedAt']}`")
          elif report is not None:
              lines.extend(["", "### Durable checkpoint after run", "- Source-state health snapshot unavailable."])

          lines.extend(
              [
                  "",
                  "> AI fallback activation is emitted as a warning in the job log; the final provider/model is persisted with each completed analysis. No run-level fallback-used field is inferred here.",
              ]
          )

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Annotate collector failure
        if: failure()
        run: |
          echo "::error title=IDX Daily Collector failed::Run ${GITHUB_RUN_NUMBER} failed. Check this Actions run and its collector summary. Persisted processing failures are also picked up by the Synapse Telegram health watcher without advancing the durable checkpoint."
