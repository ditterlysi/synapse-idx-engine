name: Apply Gemini Circuit Breaker Patch

on:
  push:
    branches:
      - fix/gemini-run-circuit-breaker
    paths:
      - ops/apply-gemini-circuit-breaker-trigger.txt

permissions:
  contents: write

concurrency:
  group: apply-gemini-circuit-breaker-patch
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/gemini-run-circuit-breaker

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply patch
        run: python ops/apply_gemini_circuit_breaker_patch.py

      - name: Install engine
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/idx_digest/source_ingestion.py tests/test_source_ingestion.py
          git diff --cached --quiet || git commit -m "Stop AI work after terminal provider rate limit"
          git push origin HEAD:fix/gemini-run-circuit-breaker
