name: IDX Cron Watchdog

# GitHub re-registers a workflow's cron whenever the workflow file changes,
# and a missed slot is never replayed. Without this watchdog the collector
# can silently stop being scheduled after a workflow edit. This job looks
# for a recent event=schedule run of daily.yml and, when none exists, fires
# a fallback workflow_dispatch and fails so the miss is visible.

on:
  schedule:
    # 21:45 UTC = 04:45 Asia/Jakarta: after the 20:07 UTC and 20:37 UTC
    # collector crons, leaving margin for GitHub's cron jitter.
    - cron: "45 21 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  check-collector-cron-fired:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Look for a recent schedule run of daily.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: main
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from datetime import datetime, timedelta, timezone

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-20",
              "User-Agent": "synapse-idx-cron-watchdog",
          }
          base = f"https://api.github.com/repos/{os.environ['REPOSITORY']}"

          def api(path: str, method: str = "GET", body: bytes | None = None):
              request = urllib.request.Request(base + path, data=body, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=15) as response:
                  return response.status, response.read()

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(hours=5)
          try:
              _, raw = api("/actions/workflows/daily.yml/runs?event=schedule&per_page=10")
          except Exception as exc:
              # An API failure must not self-heal: we cannot tell whether a
              # schedule run exists, and a blind dispatch would double-fire
              # the collector. Fail loudly so a human re-triggers manually.
              print(f"::error title=IDX cron watchdog API unavailable::{exc}")
              sys.exit(1)

          payload = json.loads(raw)
          recent = []
          for run in payload.get("workflow_runs", []):
              created_raw = run.get("created_at")
              if not isinstance(created_raw, str):
                  continue
              try:
                  created_at = datetime.fromisoformat(created_raw.replace("Z", "+00:00"))
              except ValueError:
                  continue
              if cutoff <= created_at <= now:
                  recent.append((run.get("id"), created_raw, run.get("status")))

          if recent:
              print(f"OK: collector schedule run detected: {recent[0]}")
              raise SystemExit(0)

          print(
              "::error title=IDX daily collector schedule did not fire::"
              "No event=schedule run of daily.yml in the last 5 hours. "
              "Triggering a fallback workflow_dispatch and failing this job."
          )
          try:
              status, _ = api(
                  "/actions/workflows/daily.yml/dispatches",
                  method="POST",
                  body=json.dumps({"ref": os.environ["REF"]}).encode(),
              )
              print(f"Fallback workflow_dispatch of daily.yml accepted (HTTP {status}).")
          except Exception as exc:
              print(f"::warning::Fallback dispatch failed; re-trigger daily.yml manually: {exc}")
          sys.exit(1)
          PY
