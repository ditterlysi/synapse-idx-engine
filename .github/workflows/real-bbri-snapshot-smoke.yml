name: Real BBRI Document Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/real-bbri-snapshot-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    if: github.head_ref == 'e2e/real-bbri-snapshot-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_PROVIDER: gemini
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SYNAPSE_INTERNAL_BASE_URL: ${{ secrets.SYNAPSE_INTERNAL_BASE_URL || secrets.SYNAPSE_INTERNAL_URL || vars.SYNAPSE_INTERNAL_BASE_URL || vars.SYNAPSE_INTERNAL_URL }}
      SYNAPSE_INGESTION_SECRET: ${{ secrets.SYNAPSE_INGESTION_SECRET || secrets.IDX_INGESTION_SECRET }}
      SYNAPSE_DAILY_ENABLED: 'false'
      APP_TIMEZONE: Asia/Jakarta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Verify required runtime secrets exist
        shell: bash
        run: |
          test -n "$GEMINI_API_KEY" || { echo 'GEMINI_API_KEY is missing'; exit 1; }
          test -n "$SYNAPSE_INTERNAL_BASE_URL" || { echo 'SYNAPSE_INTERNAL_BASE_URL is missing'; exit 1; }
          test -n "$SYNAPSE_INGESTION_SECRET" || { echo 'SYNAPSE_INGESTION_SECRET is missing'; exit 1; }

      - name: Verify BBRI relevance boundary
        run: synapse-idx-engine api-check -t BBRI

      - name: Download one explicit official BRI disclosure PDF
        shell: bash
        run: |
          mkdir -p real-smoke
          curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 2 \
            --user-agent 'Mozilla/5.0 Synapse-Real-Document-Smoke/1.0' \
            --header 'Accept: application/pdf,*/*' \
            'https://bri.co.id/web/guest/api/files/?path=%2Fsites%2Fdefault%2Ffiles%2Fdocuments%2FFakta%2BMaterial%2BAJB.pdf' \
            --output real-smoke/bbri-material.pdf
          python - <<'PY'
          from pathlib import Path
          path = Path('real-smoke/bbri-material.pdf')
          data = path.read_bytes()
          if not data.startswith(b'%PDF'):
              preview = data[:120].decode('utf-8', errors='replace').replace('\n', ' ')
              raise SystemExit(f'issuer document is not a PDF; first bytes: {preview!r}')
          if len(data) > 10_000_000:
              raise SystemExit('issuer document exceeds 10 MB smoke-test cap')
          print(f'official BRI PDF verified: {len(data)} bytes')
          PY

      - name: Build source-neutral real BBRI manifest
        shell: bash
        run: |
          cat > real-smoke/manifest.json <<'JSON'
          {
            "schemaVersion": "synapse-source-manifest-v1",
            "metadata": {
              "sourceKind": "issuer-public-document-smoke-v1",
              "capturedAt": "2026-08-22T10:57:00+07:00",
              "captureMethod": "single-explicit-official-issuer-url",
              "issuerDocumentUrl": "https://bri.co.id/web/guest/api/files/?path=%2Fsites%2Fdefault%2Ffiles%2Fdocuments%2FFakta%2BMaterial%2BAJB.pdf"
            },
            "coverage": {
              "complete": false
            },
            "disclosures": [
              {
                "externalId": "manual-real-bbri-20260723-bri-mi-sale",
                "ticker": "BBRI",
                "announcedAt": "2026-07-23T03:56:00+07:00",
                "title": "Report on Material Information or Facts - Sale of PT BRI Manajemen Investasi Shares",
                "subject": "Sale of 65% of PT BRI Manajemen Investasi shares to PT Danantara Asset Management",
                "disclosureType": "MATERIAL_INFORMATION",
                "sourceUrl": "https://bri.co.id/web/guest/api/files/?path=%2Fsites%2Fdefault%2Ffiles%2Fdocuments%2FFakta%2BMaterial%2BAJB.pdf",
                "metadata": {
                  "issuer": "PT Bank Rakyat Indonesia (Persero) Tbk",
                  "issuerCode": "BBRI",
                  "letterNumber": "B.178.e-CSC/CSM/CGC/07/2026",
                  "eventDate": "2026-07-22",
                  "buyer": "PT Danantara Asset Management",
                  "target": "PT BRI Manajemen Investasi",
                  "sharesTransferred": 19500000,
                  "ownershipTransferredPct": 65,
                  "documentOrigin": "official-bri-website"
                },
                "attachments": [
                  {
                    "path": "bbri-material.pdf",
                    "filename": "BBRI_material_information_BRI_MI_sale_20260723.pdf",
                    "contentType": "application/pdf",
                    "sourceUrl": "https://bri.co.id/web/guest/api/files/?path=%2Fsites%2Fdefault%2Ffiles%2Fdocuments%2FFakta%2BMaterial%2BAJB.pdf"
                  }
                ]
              }
            ]
          }
          JSON

      - name: Run real BBRI source-neutral smoke test
        shell: bash
        run: |
          set -o pipefail
          synapse-idx-engine manual-import \
            --manifest ./real-smoke/manifest.json \
            --start '2026-07-23T03:30:00+07:00' \
            --end '2026-07-23T04:30:00+07:00' \
            --confirm-publish | tee real-smoke-report.json

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-bbri-document-smoke-report
          path: real-smoke-report.json
          retention-days: 3
          if-no-files-found: ignore
