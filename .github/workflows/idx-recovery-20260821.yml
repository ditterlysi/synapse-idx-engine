name: IDX Recovery 2026-08-21

on:
  push:
    branches:
      - ops/idx-recovery-20260821
  pull_request:
    branches:
      - main

concurrency:
  group: idx-recovery-20260821
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    if: github.event_name == 'push' || github.head_ref == 'ops/idx-recovery-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SYNAPSE_INTERNAL_BASE_URL: ${{ secrets.SYNAPSE_INTERNAL_BASE_URL }}
      SYNAPSE_INGESTION_SECRET: ${{ secrets.SYNAPSE_INGESTION_SECRET }}
      APP_TIMEZONE: Asia/Jakarta
      SYNAPSE_DAILY_TRANSPORT: http
      SYNAPSE_DAILY_ALLOW_HISTORICAL_BACKFILL: "false"
      SYNAPSE_DAILY_ALLOW_TICKER_FANOUT: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ind

      - name: Install engine
        run: python -m pip install -e .

      - name: Recover poisoned-checkpoint gaps
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          from idx_digest.ai_provider import resolve_ai_provider
          from idx_digest.config import Settings
          from idx_digest.idx_polite_http import CURRENT_IDX_BASE_URL, PoliteFetchClient
          from idx_digest.idx_website_cli import _collector_runtime_settings
          from idx_digest.source_ingestion import SourceIngestionRunner
          from idx_digest.source_state_client import SourceStateSynapseClient
          from idx_digest.sources.idx_website import (
              IDX_WEBSITE_EXTERNAL_ID_PREFIX,
              IDX_WEBSITE_SOURCE_ID,
              FileCheckpointStore,
              IdxWebsiteCheckpoint,
              IdxWebsiteSource,
          )
          from idx_digest.timeutils import parse_boundary

          WINDOWS = [
              ("2026-08-21T00:00:00+07:00", "2026-08-21T09:00:00+07:00"),
              ("2026-08-21T09:00:00+07:00", "2026-08-21T10:00:00+07:00"),
              ("2026-08-21T10:00:00+07:00", "2026-08-21T11:00:00+07:00"),
              ("2026-08-21T11:00:00+07:00", "2026-08-21T13:00:00+07:00"),
              ("2026-08-21T13:00:00+07:00", "2026-08-21T15:00:00+07:00"),
              ("2026-08-21T15:00:00+07:00", "2026-08-21T16:00:00+07:00"),
              ("2026-08-21T16:00:00+07:00", "2026-08-21T16:30:00+07:00"),
              ("2026-08-21T16:30:00+07:00", "2026-08-21T17:00:00+07:00"),
              ("2026-08-21T17:00:00+07:00", "2026-08-21T17:30:00+07:00"),
              ("2026-08-21T17:30:00+07:00", "2026-08-21T17:35:00+07:00"),
              ("2026-08-21T17:35:00+07:00", "2026-08-21T17:40:00+07:00"),
              ("2026-08-21T17:40:00+07:00", "2026-08-21T17:50:00+07:00"),
              ("2026-08-21T17:50:00+07:00", "2026-08-21T18:00:00+07:00"),
              ("2026-08-21T18:00:00+07:00", "2026-08-21T18:30:00+07:00"),
              ("2026-08-21T18:30:00+07:00", "2026-08-21T19:00:00+07:00"),
              ("2026-08-21T19:00:00+07:00", "2026-08-21T20:00:00+07:00"),
              ("2026-08-21T20:00:00+07:00", "2026-08-21T21:00:00+07:00"),
              ("2026-08-21T21:00:00+07:00", "2026-08-21T22:00:00+07:00"),
              ("2026-08-21T22:00:00+07:00", "2026-08-21T22:47:00+07:00"),
          ]

          EXISTING_IDS = (
              "20260820232958-B.028-Corpsec-ETT-BEEF-VIII-2026_id-id",
              "20260821221047-BXS/08/021/005/2026_id-id",
              "20260822092619-012/HDK/SP/VIII/2026_id-id",
              "20260822174532-LK/22082026/0001/1_id-id",
              "20260822191348-001/KI/CORSEC/VIII/2026_id-id",
              "20260823014614-LK/23082026/0001/1_id-id",
          )

          settings = Settings()
          runtime_settings = _collector_runtime_settings(settings, run_mode="DAILY")
          provider_runtime = resolve_ai_provider(runtime_settings)
          checkpoint_path = Path("idx-recovery-checkpoint.json")
          checkpoint_store = FileCheckpointStore(checkpoint_path)
          checkpoint_store.save(IdxWebsiteCheckpoint(EXISTING_IDS, None))
          reports = []
          failures = []

          for index, (start_raw, end_raw) in enumerate(WINDOWS, start=1):
              start_at = parse_boundary(start_raw, settings.app_timezone)
              end_at = parse_boundary(end_raw, settings.app_timezone)
              idx_client = PoliteFetchClient(
                  base_url=CURRENT_IDX_BASE_URL,
                  user_agent=settings.idx_user_agent,
                  request_delay_seconds=runtime_settings.synapse_daily_request_delay_seconds,
                  request_jitter_seconds=runtime_settings.synapse_daily_request_jitter_seconds,
                  max_retries=2,
                  max_requests=min(runtime_settings.synapse_daily_max_source_requests, 50),
                  max_download_bytes_total=runtime_settings.synapse_daily_max_download_bytes,
              )
              source = IdxWebsiteSource(
                  idx_client,
                  checkpoint_store=checkpoint_store,
                  staging_dir=settings.data_dir / "idx-website-cache",
                  page_size=min(settings.idx_page_size, 100),
                  max_pages=10,
                  timezone_name=settings.app_timezone,
              )

              def client_factory(client_settings: Settings):
                  return SourceStateSynapseClient(
                      client_settings,
                      source_id=IDX_WEBSITE_SOURCE_ID,
                      source_request_counter=lambda: idx_client.request_count,
                  )

              try:
                  result = SourceIngestionRunner(
                      provider_runtime.settings,
                      source,
                      client_factory=client_factory,
                      summarizer_factory=provider_runtime.summarizer_factory,
                      run_mode="MANUAL_BACKFILL",
                      allow_coverage_commit=False,
                      require_external_id_prefix=IDX_WEBSITE_EXTERNAL_ID_PREFIX,
                  ).run_window(start_at=start_at, end_at=end_at)
                  if result.processing_ok:
                      source.commit_checkpoint()
                  report = {
                      "window": index,
                      "start": start_raw,
                      "end": end_raw,
                      "runId": result.run_id,
                      "status": result.status,
                      "processingOk": result.processing_ok,
                      "disclosuresAvailable": result.publish.disclosures_available,
                      "disclosuresCreated": result.publish.disclosures_created,
                      "filesExtracted": result.publish.files_extracted,
                      "analysesCompleted": result.publish.analyses_completed,
                      "partialDisclosures": result.publish.partial_disclosures,
                      "sourceRequests": idx_client.request_count,
                      "diagnostics": result.source_diagnostics,
                  }
                  reports.append(report)
                  print(json.dumps(report, ensure_ascii=False))
                  if not result.processing_ok:
                      failures.append(report)
              except Exception as exc:
                  failure = {
                      "window": index,
                      "start": start_raw,
                      "end": end_raw,
                      "errorType": type(exc).__name__,
                      "error": str(exc),
                      "sourceRequests": idx_client.request_count,
                  }
                  reports.append(failure)
                  failures.append(failure)
                  print(json.dumps(failure, ensure_ascii=False))
              finally:
                  idx_client.close()

          Path("idx-recovery-report.json").write_text(
              json.dumps({"reports": reports, "failures": failures}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({
              "windows": len(WINDOWS),
              "failedWindows": len(failures),
              "createdTotal": sum(r.get("disclosuresCreated", 0) for r in reports),
              "availableTotal": sum(r.get("disclosuresAvailable", 0) for r in reports),
              "analysesTotal": sum(r.get("analysesCompleted", 0) for r in reports),
          }, ensure_ascii=False))
          if failures:
              raise SystemExit(1)
          PY

      - name: Upload recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idx-recovery-20260821-report
          path: idx-recovery-report.json
          if-no-files-found: warn
