name: IDX Metadata Live Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'feat/automated-idx-collector-mvp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e "."

      - name: Probe one public IDX metadata page
        shell: bash
        run: |
          python - <<'PY'
          import json

          from idx_digest.idx_polite_http import PoliteFetchClient

          params = {
              "kodeEmiten": "",
              "emitenType": "*",
              "indexFrom": 0,
              "pageSize": 5,
              "dateFrom": "20260821",
              "dateTo": "20260821",
              "lang": "id",
              "keyword": "",
          }

          with PoliteFetchClient(
              request_delay_seconds=10.0,
              request_jitter_seconds=0.0,
              max_retries=0,
              max_requests=1,
          ) as client:
              payload = client.get_json("/primary/ListedCompany/GetAnnouncement", params=params)

          rows = []
          for item in (payload.get("Replies") or [])[:5]:
              announcement = item.get("pengumuman") or {}
              rows.append(
                  {
                      "id": str(announcement.get("Id2") or ""),
                      "ticker": str(announcement.get("Kode_Emiten") or "").strip(),
                      "announcedAt": announcement.get("TglPengumuman"),
                      "title": announcement.get("JudulPengumuman"),
                      "attachmentCount": len(item.get("attachments") or []),
                  }
              )

          print(
              json.dumps(
                  {
                      "ok": True,
                      "requestedDate": "2026-08-21",
                      "sourceRequests": client.request_count,
                      "resultCount": payload.get("ResultCount"),
                      "sample": rows,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY
