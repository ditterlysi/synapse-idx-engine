name: IDX Website Controlled E2E

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/idx-website-diagnostic-e2e.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'feat/automated-idx-collector-mvp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      SYNAPSE_INTERNAL_BASE_URL: ${{ secrets.SYNAPSE_INTERNAL_BASE_URL || secrets.SYNAPSE_INTERNAL_URL || vars.SYNAPSE_INTERNAL_BASE_URL || vars.SYNAPSE_INTERNAL_URL }}
      SYNAPSE_INGESTION_SECRET: ${{ secrets.SYNAPSE_INGESTION_SECRET || secrets.IDX_INGESTION_SECRET }}
      IDX_BASE_URL: https://www.idx.id
      IDX_PAGE_SIZE: '100'
      SYNAPSE_DAILY_REQUEST_DELAY_SECONDS: '10'
      SYNAPSE_DAILY_REQUEST_JITTER_SECONDS: '2'
      SYNAPSE_DAILY_MAX_SOURCE_REQUESTS: '10'
      SYNAPSE_DAILY_MAX_ATTACHMENTS: '5'
      SYNAPSE_DAILY_MAX_DOWNLOAD_BYTES: '50000000'
      SYNAPSE_DAILY_MAX_AI_DOCUMENTS: '5'
      SYNAPSE_DAILY_MAX_RUN_SECONDS: '900'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Validate runtime secrets
        shell: bash
        run: |
          test -n "$GEMINI_API_KEY" || { echo 'Missing GEMINI_API_KEY'; exit 1; }
          test -n "$SYNAPSE_INTERNAL_BASE_URL" || { echo 'Missing SYNAPSE_INTERNAL_BASE_URL'; exit 1; }
          test -n "$SYNAPSE_INGESTION_SECRET" || { echo 'Missing SYNAPSE_INGESTION_SECRET'; exit 1; }

      - name: Check Synapse boundary
        run: synapse-idx-engine api-check -t BACA

      - name: Collect one real BACA disclosure with Gemini
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          synapse-idx-website collect \
            --start '2026-08-21T22:10:00+07:00' \
            --end '2026-08-21T22:11:30+07:00' \
            --checkpoint './data/idx-website-e2e-checkpoint.json' \
            --enable-source \
            --confirm-publish \
            | tee first-report.json

      - name: Verify first live collection
        shell: python
        run: |
          import json

          report = json.loads(open('first-report.json', encoding='utf-8').read())
          diagnostics = report['sourceDiagnostics']
          publish = report['publish']

          assert report['ok'] is True, report
          assert report['processingOk'] is True, report
          assert report['status'] == 'PARTIAL', report
          assert report['sourceId'] == 'idx-website', report
          assert report['sourceComplete'] is False, report
          assert report['coverageCommitted'] is False, report
          assert report['coverageAuthoritative'] is False, report
          assert report['checkpointCommitted'] is True, report
          assert report['scheduleEnabled'] is False, report
          assert report['sourceTransport'] == 'http-only', report
          assert diagnostics['disclosuresNew'] == 1, diagnostics
          assert diagnostics['attachmentDownloads'] == 1, diagnostics
          assert diagnostics['sourceRequests'] <= 4, diagnostics
          assert publish['disclosuresAvailable'] == 1, publish
          assert publish['attachmentsStaged'] == 1, publish
          assert publish['filesExtracted'] == 1, publish
          assert publish['documentsAnalyzed'] == 1, publish
          assert publish['analysesCompleted'] == 1, publish
          assert publish['partialDisclosures'] == 0, publish
          assert publish['errors'] == [], publish

      - name: Repeat same window using committed checkpoint
        shell: bash
        run: |
          set -euo pipefail
          synapse-idx-website collect \
            --start '2026-08-21T22:10:00+07:00' \
            --end '2026-08-21T22:11:30+07:00' \
            --checkpoint './data/idx-website-e2e-checkpoint.json' \
            --enable-source \
            --confirm-publish \
            | tee repeat-report.json

      - name: Verify repeat is incremental
        shell: python
        run: |
          import json

          report = json.loads(open('repeat-report.json', encoding='utf-8').read())
          diagnostics = report['sourceDiagnostics']
          publish = report['publish']

          assert report['ok'] is True, report
          assert report['processingOk'] is True, report
          assert report['status'] == 'PARTIAL', report
          assert report['coverageCommitted'] is False, report
          assert report['checkpointCommitted'] is True, report
          assert report['scheduleEnabled'] is False, report
          assert diagnostics['disclosuresNew'] == 0, diagnostics
          assert diagnostics['attachmentDownloads'] == 0, diagnostics
          assert diagnostics['sourceRequests'] <= 2, diagnostics
          assert publish['disclosuresAvailable'] == 0, publish
          assert publish['disclosuresCreated'] == 0, publish
          assert publish['attachmentsStaged'] == 0, publish
          assert publish['filesExtracted'] == 0, publish
          assert publish['documentsAnalyzed'] == 0, publish
          assert publish['analysesCompleted'] == 0, publish
          assert publish['errors'] == [], publish
